# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc (thiếu tên tài khoản, thiếu URL) hoặc cần xin xác nhận trước khi thực hiện hành động gửi tin."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng (tweet) gần đây của một tài khoản Twitter/X theo screenname (ví dụ Sam Altman -> 'sama', Elon Musk -> 'elonmusk')."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức trên internet. Dùng khi cần tìm kiếm bài viết, tin tức thời sự. KHÔNG dùng để tra cứu tweet trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung chi tiết từ một đường dẫn URL (bắt đầu bằng http:// hoặc https://). Dùng khi người dùng cung cấp link cụ thể để đọc hoặc tóm tắt bài viết."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản lên Telegram. CHỈ ĐƯỢC GỌI khi confirmed=true (người dùng đã xác nhận đồng ý gửi). Nếu chưa xác nhận, phải gọi clarify để hỏi trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team New Tools (Bonus Track) ----------------
  - name: crypto_price
    description: "Tra cứu giá tiền điện tử (crypto) theo thời gian thực (BTC, ETH, SOL, BNB...). Dùng khi người dùng hỏi giá coin, tỷ giá crypto."
    parameters:
      type: object
      properties:
        symbol: {type: string, default: "BTC", description: "Ký hiệu tiền điện tử (ví dụ BTC, ETH, SOL)"}
        currency: {type: string, default: "USDT", description: "Đơn vị tiền tệ (ví dụ USDT, USD)"}
      required: [symbol]

  - name: github_search
    description: "Tìm kiếm kho lưu trữ mã nguồn mở (repositories) trên GitHub theo từ khóa và độ phổ biến (stars). Dùng khi người dùng tìm thư viện, dự án code, open-source repo."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm repo"}
        limit: {type: integer, default: 5, description: "Số lượng repo trả về"}
        sort: {type: string, enum: [stars, forks, updated], default: "stars", description: "Tiêu chí sắp xếp"}
      required: [query]

  - name: weather
    description: "Tra cứu thời tiết hiện tại và điều kiện khí hậu của một thành phố hoặc địa điểm. Dùng khi người dùng hỏi thời tiết, nhiệt độ ở đâu đó."
    parameters:
      type: object
      properties:
        city: {type: string, default: "Hanoi", description: "Tên thành phố hoặc địa điểm (ví dụ Hanoi, Ho Chi Minh, Tokyo)"}
      required: [city]

  - name: calculator
    description: "Tính toán biểu thức số học (toán học) an toàn cho agent, hỗ trợ các phép tính cộng, trừ, nhân, chia, lũy thừa, căn bậc hai. Dùng khi người dùng yêu cầu tính toán số liệu cụ thể."
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Biểu thức toán học cần tính toán (ví dụ: '15 * 8 + 42 / 2', 'sqrt(144)')"}
      required: [expression]

